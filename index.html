<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoQualize</title>
<style>
body{font:15px system-ui;max-width:980px;margin:2rem auto;padding:0 16px;color:#1f1f1d}
label{margin-right:1rem}button{padding:.4rem 1rem}img{max-width:100%;margin-top:1rem}
#out{font-weight:600;margin-top:1rem}
</style>
<h1>LoQualize</h1>
<p>Quantum-gravimeter-aided ship navigation. GNSS is lost after 30 min; two Kalman filters see the same IMU data, one also uses a gravimeter. Runs the repo's Python in your browser (Pyodide).</p>
<label>Terrain <select id="terrain"><option>rough</option><option>flat</option></select></label>
<label>IMU grade <select id="grade"><option>navigation</option><option>tactical</option><option>consumer</option></select></label>
<label>Hours <input id="hours" type="number" value="4" min="1" max="8" style="width:4em"></label>
<label>Runs <input id="seeds" type="number" value="3" min="1" max="10" style="width:4em"></label>
<label><input id="vary" type="checkbox" checked> Random route</label>
<button id="go" disabled>Run</button>
<div id="status">Loading Python (~30 MB, first time only)...</div>
<div id="out"></div>
<img id="fig" alt="">
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
// ponytail: UI freezes during a run (no web worker); move to a worker if runs get long
const FILES=["general_filt.py","gravity.py","main_gravity.py","models.py","presets.py","sensors.py",
 "movements/__init__.py","movements/circle.py","movements/ship.py","movements/sinusoid.py","movements/space.py"];
const $=id=>document.getElementById(id);
let py;
(async()=>{
  py=await loadPyodide();
  await py.loadPackage(["numpy","scipy","matplotlib"]);
  py.FS.mkdir("LoQualize");py.FS.mkdir("LoQualize/movements");py.FS.writeFile("LoQualize/__init__.py","");
  for(const f of FILES) py.FS.writeFile("LoQualize/"+f,await (await fetch(f,{cache:"no-cache"})).text());
  py.runPython(`import os;os.environ["MPLBACKEND"]="Agg"`);
  $("status").textContent="Ready.";$("go").disabled=false;
})().catch(e=>$("status").textContent="Load failed: "+e);
$("go").onclick=()=>{
  $("go").disabled=true;$("status").textContent="Simulating...";
  setTimeout(()=>{
    try{
      py.globals.set("cfg",py.toPy({terrain:$("terrain").value,grade:$("grade").value,
        hours:+$("hours").value,seeds:+$("seeds").value,rs:$("vary").checked?1+Math.floor(Math.random()*1e6):1}));
      const [png,txt]=py.runPython(`
import io
from LoQualize.main_gravity import run, plot
from LoQualize.gravity import GravityField
import numpy as np
f=GravityField(cfg["terrain"])
R=[run(f,grade=cfg["grade"],hours=cfg["hours"],seed=s,route_seed=int(cfg["rs"])) for s in range(int(cfg["seeds"]))]
b=io.BytesIO()
plot(R,f,"GNSS lost after 30 min - %s gravity, %s-grade IMU"%(cfg["terrain"],cfg["grade"]),b,False)
m=lambda k:np.median([r[k][-1] for r in R])
(b.getvalue(),"Median final error: INS only %.0f m | INS + gravimeter %.0f m"%(m("ins_err"),m("grav_err")))
`).toJs();
      $("fig").src=URL.createObjectURL(new Blob([png],{type:"image/png"}));
      $("out").textContent=txt;$("status").textContent="Done.";
    }catch(e){$("status").textContent="Error: "+e}
    $("go").disabled=false;
  },50);
};
</script>
